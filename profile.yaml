summary: "I'm a Business Intelligence Analyst with 3+ years of experience turning operational complexity into measurable business outcomes. Grounded in business fundamentals from a Hospitality Management degree and sharpened through an Information Systems engineering diploma alongside hands-on delivery at Desert Suspension (an authorized 4x4 vehicle equipment dealer operating across Saudi Arabia), where I served as the primary data analyst across Sales, Marketing, and executive leadership, delivering end-to-end data solutions that drove significant improvements in reporting efficiency, inventory accuracy, and profitability."

