jarvis_projects:
  - name: "RBC GAM Monthly Reporting Dashboard - Business Requirements Document."
    git_url: "/bsa_gam"
    description: "Led requirements elicitation for an automated Monthly Performance Reporting dashboard for RBC Global Asset Management, replacing a manual ~25-hour, five-system process that had produced an executive-facing data error. Ran a structured interview with the sponsoring Managing Director and routed current-state and technical questions to the data analyst and development lead, then authored a complete 13-section Business Requirements Document with testable functional and non-functional requirements (Given/When/Then), MoSCoW prioritisation, a RACI matrix, dependency and risk registers, and a burn-down tracker. Managed scope through formal change control (deferring a CFO real-time-feed request to a later phase), logged unresolved dependencies with owners and recommended options (including a broken vendor API and a direct-database compliance review), and delivered a 10-minute executive briefing recommending sign-off within the governance cycle."
  - name: "Linux Cluster Resource Monitoring System."
    git_url: "/linux_sql"
    description: "Designed and deployed a Linux cluster monitoring agent on Rocky Linux 9 (GCP) to give administrators real-time visibility into CPU, memory, and disk usage across distributed nodes, supporting informed decisions around resource allocation and capacity planning. Built two Bash scripts to collect hardware specs and live usage metrics, persisting data into a centralized PostgreSQL instance containerized via Docker. Automated metric collection with crontab and validated end-to-end pipeline accuracy through SQL-based analysis."
  - name: "Retail Stock Trading Platform Software Requirements Specification."
    git_url: "/bsa_stock_trading"
    description: "Conducted stakeholder elicitation to author a comprehensive Software Requirements Document (SRD) for a full-stack web and mobile retail self-directed trading application commissioned by a Canadian bank. Structured, clear functional boundaries (FRs) managing complex, atomic multi-account portfolios (TFSA, RRSP, Cash Accounts), strict buy/sell trade constraints, and 5-minute interval third-party Market Data API integration flows. Engineered robust non-functional requirements targeting high security, system availability, and data integrity parameters for an expected launch volume of 150,000 to 200,000 active clients."
  - name: "Retail Data Analytics & Customer Segmentation Pipeline."
    git_url: "/python_data_analytics"
    description: "Developed a Python-based Proof of Concept analytics pipeline inside Docker to convert 1.07 million rows of raw historical transaction data from a PostgreSQL database into actionable marketing intelligence. Built clean, top-down Jupyter Notebook pipelines executing data wrangling, string normalization, snake_case table mappings, and strict split tracking for placed versus cancelled orders to insulate revenue reporting. Engineered custom Recency, Frequency, and Monetary (RFM) features to categorize the customer base into distinct, operational clusters (e.g., Champions, At Risk, Hibernating). Delivered a high-level executive presentation featuring professional Seaborn and Matplotlib visualizations mapping month-over-month growth patterns and demand peaks to guide seasonal stock optimization."
highlighted_projects:
  - name: "Law Enforcement BI and Resource Optimization Pipeline."
    git_url: "https://github.com/MahmoudBoghdadi/Law-Enforcement-Business-Intelligence/tree/main"
    description: "Built an end-to-end crime analytics platform on 1.23M+ Chicago Police Department incidents (2021-2025) using a SQL Server star schema (4 dimension tables, 1 fact table) and a Python ETL pipeline maintaining 96% data completeness across critical fields. Delivered descriptive, diagnostic, predictive, and prescriptive analytics across the full stack. Trained three ML models: a Random Forest crime-type classifier (88% accuracy, top features: hour of day and severity level), a Gradient Boosting volume forecaster (R-squared 0.62, RMSE 50.66 crimes/day, MAPE 21.23%), and a DBSCAN geospatial hotspot detector (epsilon 0.01 approx. 1km radius, min samples 20) that identified 15 high-risk clusters accounting for 35% of all incidents."
