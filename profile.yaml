jarvis_projects:
  - name: "Linux Cluster Resource Monitoring System"
    git_url: "/linux_sql"
    description: "Designed and deployed a Linux cluster monitoring agent on Rocky Linux 9 (GCP) to give administrators real-time visibility into CPU, memory, and disk usage across distributed nodes, supporting informed decisions around resource allocation and capacity planning. Built two Bash scripts to collect hardware specs and live usage metrics, persisting data into a centralized PostgreSQL instance containerized via Docker. Automated metric collection with crontab and validated end-to-end pipeline accuracy through SQL-based analysis."

highlighted_projects:
  - name: "Law Enforcement BI and Resource Optimization Pipeline"
    git_url: "https://github.com/MahmoudBoghdadi/Law-Enforcement-Business-Intelligence/tree/main"
    description: "Built an end-to-end crime analytics platform on 1.23M+ Chicago Police Department incidents (2021-2025) using a SQL Server star schema (4 dimension tables, 1 fact table) and a Python ETL pipeline maintaining 96% data completeness across critical fields. Delivered descriptive, diagnostic, predictive, and prescriptive analytics across the full stack. Trained three ML models: a Random Forest crime-type classifier (88% accuracy, top features: hour of day and severity level), a Gradient Boosting volume forecaster (R-squared 0.62, RMSE 50.66 crimes/day, MAPE 21.23%), and a DBSCAN geospatial hotspot detector (epsilon 0.01 approx. 1km radius, min samples 20) that identified 15 high-risk clusters accounting for 35% of all incidents."

professional_experience:
  - title: "Business Analyst Consultant"
    company: "Jarvis"
    duration: "04/2026-present"
    description: "Delivering BSA and data projects in an agile, sprint-based environment with structured code reviews and daily standups. Built a Linux cluster monitoring agent using Bash, PostgreSQL, and Docker to automate resource metric collection across a distributed environment."
  - title: "Business Intelligence Analyst"
    company: "Desert Suspension"
    duration: "08/2024-03/2026"
    description: "Owned end-to-end portfolio analytics and operational reporting across three international facilities, serving as the primary liaison between Sales, Marketing, and executive leadership. Automated ETL workflows using Python and SQL, reducing manual reporting cycles by 75% and eliminating cross-departmental data silos. Applied statistical trend analysis to inventory data, achieving 85% forecasting accuracy and contributing to a 17% increase in net profit. Governed a centralized data warehouse maintaining integrity and usability standards across all pipelines. Produced audit-ready technical and business documentation ensuring reproducibility and knowledge continuity across reporting deliverables. Operated in an agile workflow, partnering with cross-functional stakeholders to align data outputs with strategic business priorities."
  - title: "Data Analyst"
    company: "Upwork"
    duration: "02/2023-01/2024"
    description: "Delivered freelance data analytics engagements across multiple clients, producing over 10 Power BI dashboards with real-time KPI tracking that accelerated decision-making speed by 40% for 15+ stakeholders. Built automated SQL ETL pipelines consolidating multiple data sources at 98% accuracy, and designed A/B tests using Python statistical methods that drove a 15% improvement in customer engagement metrics."

